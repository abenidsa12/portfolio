about_me:
  - Hallo, ich bin Abeni!
  - Im Herzen Biologin und Wissenschaftlerin, beruflich Teamkoordinatorin und eine kreative Seele, die immer in Bewegung ist. Ob ich die Geheimnisse des Darmmikrobioms von Totengräberkäfern entschlüssele, Veranstaltungen organisiere und die Logistik mit Präzision plane oder dem Klavier schöne Töne entlocke – ich fühle mich dort am wohlsten, wo Wissenschaft, Kreativität und Neugier aufeinandertreffen.
  - Frauen und FLINTA*-Personen in der Wissenschaft zu unterstützen und dafür zu sorgen, dass jede Stimme gehört wird – das treibt mich in meiner Arbeit als Frauen- und Gleichstellungsbeauftragte an.
  - Mit einem Master in Biologie von der RPTU in Kaiserslautern habe ich mich mit vielen Themen beschäftigt – von Totengräberkäfern über Blattschneiderameisen bis hin zu den mikrobiellen Geheimnissen von Zugvögeln im Wattenmeer. Heute organisiere ich Projekte, arbeite eng mit Wissenschaftlerinnen und Wissenschaftlern aus Informatik, Mathematik, Psychologie und Computational Neuroscience zusammen, unterstütze sie in Forschung und Lehre, verwalte Budgets und sorge als Teamassistentin dafür, dass alles reibungslos läuft. Außerdem war ich Büroleiterin des Vizepräsidenten für Digitalisierung und Nachhaltigkeit, der heute Präsident der TU Berlin ist.
  - Neben der Arbeit bin ich Pianistin, Sängerin, Künstlerin (ich zeichne und male gern) und Abenteurerin, die gerne reist und Momente mit der Kamera festhält.
  - Für mich ist das Leben eine Balance aus Logik und Kreativität, Planung und Spontaneität, Forschung und Rhythmus.
  - Lass uns in Kontakt treten! Ob Wissenschaft, Projektmanagement oder die schönsten Reiseziele in Deutschland (und Europa) – ich freue mich immer über ein gutes Gespräch.

monologue:
  - Mein Bachelorstudium legte den Grundstein für mein Verständnis biologischer Systeme, evolutionärer Prozesse und ökologischer Wechselwirkungen. Aus Interesse an der Forschung absolvierte ich anschließend einen Master of Science in Zoologie in Indien und einen Master in Biologie in Deutschland. Dieses Studium vertiefte meine Kenntnisse in molekularer Ökologie, Mikrobiomforschung und Artinteraktionen. Meine Masterarbeit brachte mir praktische Erfahrung in genetischer Analyse, Datenvisualisierung und experimenteller Forschung – ein klarer Vorteil in der wissenschaftlichen Forschung und der computergestützten Biologie. Während die Wissenschaft ein zentraler Teil meines Lebens ist, haben meine außerberuflichen Erfahrungen meine Fähigkeit geprägt, zu kommunizieren, zu führen und mich in unterschiedlichen Umgebungen anzupassen.
  - Mein Ziel ist es, Wissenschaftlerinnen und Wissenschaftler bei der Verwirklichung ihrer Vorhaben zu unterstützen, indem ich mich um die Arbeit hinter den Kulissen kümmere – eine Aufgabe, die mir wirklich Freude macht.

