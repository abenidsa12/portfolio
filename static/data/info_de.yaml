portfolio:
  - filename: "Enhance_1.jpeg"
    title: "ENHANCE STAFF WEEK"
    description: |
      Vom 6. bis 8. Mai 2026 hatte ich die Gelegenheit, an der Staff Week des GREAT-Programms der ENHANCE-Allianz teilzunehmen, ausgerichtet von der Technischen Universität Danzig. Es war eine wertvolle Chance, sich mit Kolleginnen und Kollegen aus verschiedenen Abteilungen der Allianz auszutauschen – Technische Universität Berlin, TU Delft, ETH Zürich, RWTH Aachen, Politecnico di Milano, Norwegian University of Science and Technology (NTNU) und Universitat Politècnica de València (UPV) – und aus erster Hand zu erleben, wie die Abläufe an der Technischen Universität Danzig tatsächlich funktionieren.

      Aus E-Mails und geteilten Dokumenten kann man nur begrenzt lernen. Sich mit den Menschen zusammenzusetzen, die diese Prozesse täglich gestalten, und ihre Sichtweise zu hören, hat den entscheidenden Unterschied gemacht.

      Neben den Workshops und dem Job Shadowing ist mir vor allem die Gastfreundschaft in Erinnerung geblieben. Vom ersten Tag an haben alle dafür gesorgt, dass wir uns wirklich willkommen fühlten – und diese Offenheit hat den Austausch umso bereichernder gemacht.

      Ich bin dankbar für die neuen Kontakte und Erkenntnisse und freue mich darauf zu sehen, wie sie unsere Zusammenarbeit in der Allianz künftig prägen werden. 🌱

  - filename: "1.jpg"
    title: "🪔 Entzünden der Zeremonienlampe – Chor-Austauschprojekt"
    description: "Als eingeladene Delegierte besuchten wir eine Schule, um Schülerinnen und Schüler zu begeistern und zu motivieren. Als Ehrengäste die Zeremonienkerze zu entzünden, war ein ehrenvoller Moment – ein Symbol für Wissen, Einheit und den Geist des kulturellen Austauschs."

  - filename: "2.jpg"
    title: "🎶 Internationaler Chor-Austausch – Gruppenfoto"
    description: "Ein Gruppenfoto mit der Jugendkantorei Eichstätt und Schülerinnen und Schülern der St. Patrick's School, das den gemeinsamen Geist von Zusammenarbeit, Musik und interkultureller Freundschaft während des internationalen Austauschprogramms einfängt."

  - filename: "3.jpg"
    title: "🌳 Pflanzenökologie und Herbivorie in unterschiedlichen Lebensräumen"
    description: "Dokumentation der Feldarbeit am Schneeweiderhof mit Vegetationsaufnahmen und Erfassung der Biodiversität. Das Bild steht für die Untersuchung des Herbivoriedrucks auf Birken in Wald- und Steinbruchhabitaten mit Fokus darauf, wie Baumvielfalt ökologische Wechselwirkungen prägt."

  - filename: "6.jpg"
    title: "🏆 After-Work-Cup – Teamgeist siegt"
    description: "Was als spontane Idee im Gruppenchat begann, wurde zu einem unvergesslichen Teamsieg. Wir haben einfach aus Spaß und guter Laune mitgespielt, gegen 17 Teams angetreten und uns selbst überrascht, als wir den Pokal mit ins Lab gebracht haben – eine Erinnerung daran, dass mit den richtigen Menschen und der richtigen Energie Großartiges ganz von selbst entsteht."
